<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tour Search Nha Trang</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">

  <div class="hero-content">

    <h1>TOUR SEARCH</h1>

    <p>Экскурсии и развлечения Нячанга</p>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Поиск тура / Search tour..."
      >
    </div>

  </div>

</header>


<main>

  <div class="categories">

    <button class="category active" data-category="ALL">
      Все
    </button>

    <button class="category" data-category="Далат">
      Далат
    </button>

    <button class="category" data-category="Море и острова">
      Море и острова
    </button>

    <button class="category" data-category="Природа и приключения">
      Природа и приключения
    </button>

    <button class="category" data-category="Краски Нячанг">
      Краски Нячанг
    </button>

    <button class="category" data-category="Вьетнам без туристов">
      Вьетнам без туристов
    </button>

    <button class="category" data-category="Vinpearl">
      Vinpearl
    </button>

  </div>


  <section id="results" class="results">

  </section>

</main>


<div id="modal" class="modal">

  <div class="modal-content">

    <button id="closeModal" class="close">
      ×
    </button>

    <div id="modalBody"></div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
