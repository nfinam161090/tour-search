<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Туры Нячанга</title>
  <meta name="description" content="Экскурсии и развлечения в Нячанге">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <button class="brand" id="brandBtn" type="button" aria-label="На главную">
        <span class="brand-mark">TN</span>
        <span>
          <strong>Туры Нячанга</strong>
          <small>Экскурсии • развлечения • отдых</small>
        </span>
      </button>
    </div>
  </header>

  <main class="container main">
    <section id="listView" class="list-view">
      <div class="hero">
        <h1>Экскурсии и туры из Нячанга</h1>
        <p>Найдите тур и откройте подробную информацию и фото.</p>
      </div>

      <div class="toolbar">
        <label class="search-box" for="searchInput">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" inputmode="search" autocomplete="off"
                 placeholder="Поиск по-русски или English..." aria-label="Поиск туров">
          <button id="clearSearch" class="clear-search" type="button" aria-label="Очистить поиск" hidden>×</button>
        </label>
        <div id="categoryBar" class="category-bar" role="tablist" aria-label="Категории"></div>
      </div>

      <div id="listStatus" class="status" aria-live="polite"></div>
      <div id="tourList" class="tour-list"></div>
    </section>

    <section id="detailView" class="detail-view" hidden>
      <button id="backBtn" class="back-btn" type="button">← Назад</button>
      <div id="detailStatus" class="status" aria-live="polite"></div>
      <article id="tourDetail" class="tour-detail"></article>
    </section>
  </main>

  <div id="viewer" class="viewer" hidden aria-modal="true" role="dialog" aria-label="Просмотр фото">
    <div class="viewer-topbar">
      <div id="viewerCounter" class="viewer-counter"></div>
      <button id="viewerClose" class="viewer-close" type="button" aria-label="Закрыть">×</button>
    </div>

    <button id="viewerPrev" class="viewer-nav viewer-prev" type="button" aria-label="Предыдущее фото">‹</button>
    <div id="viewerStage" class="viewer-stage">
      <img id="viewerImage" alt="" draggable="false">
    </div>
    <button id="viewerNext" class="viewer-nav viewer-next" type="button" aria-label="Следующее фото">›</button>

    <div class="viewer-hint">← → · ESC · swipe · pinch / wheel zoom</div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
